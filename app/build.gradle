def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    compileSdkVersion 31
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.dishii.zelda3"
        }
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 5
        versionName "2.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-16"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-16", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    // release signing: put a keystore.properties next to the root build.gradle
    // (storeFile/storePassword/keyAlias/keyPassword); without it the release
    // build is simply unsigned, so the repo still builds for everyone
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lintOptions {
        abortOnError false
    }
    
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

task raJvmTestClasses(type: JavaCompile) {
    source = files(
            'src/main/java/com/dishii/zelda3/BpsPatcher.java',
            'src/main/java/com/dishii/zelda3/RomVerification.java',
            'src/main/java/com/dishii/zelda3/RetroAchievementsConfig.java',
            'src/main/java/com/dishii/zelda3/RetroAchievementsHttp.java',
            'src/main/java/com/dishii/zelda3/RetroAchievementsUiModel.java',
            'src/test/java/com/dishii/zelda3/RetroAchievementsConfigTest.java',
            'src/test/java/com/dishii/zelda3/RetroAchievementsHttpTest.java',
            'src/test/java/com/dishii/zelda3/RetroAchievementsUiModelTest.java')
    destinationDirectory.set(file("$buildDir/ra-jvm-tests"))
    classpath = files()
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

task raConfigTest(type: JavaExec, dependsOn: raJvmTestClasses) {
    classpath = files("$buildDir/ra-jvm-tests")
    mainClass.set('com.dishii.zelda3.RetroAchievementsConfigTest')
}

task raHttpTest(type: JavaExec, dependsOn: raJvmTestClasses) {
    classpath = files("$buildDir/ra-jvm-tests")
    mainClass.set('com.dishii.zelda3.RetroAchievementsHttpTest')
}

task raUiModelTest(type: JavaExec, dependsOn: raJvmTestClasses) {
    classpath = files("$buildDir/ra-jvm-tests")
    mainClass.set('com.dishii.zelda3.RetroAchievementsUiModelTest')
}

task raJvmTests(dependsOn: [raConfigTest, raHttpTest, raUiModelTest]) {
    doLast {
        println 'RA JVM tests passed: 3'
    }
}

task raNativeAssertions(type: Exec) {
    commandLine 'sh', 'jni/src/tests/ra_integration_static_test.sh'
}

check.dependsOn raJvmTests, raNativeAssertions
